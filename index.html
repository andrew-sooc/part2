<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch the Square — Level 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🎮 Catch the Square</h1>

        <div class="stats">
            <span>🏆 Score: <b id="score">0</b></span>
            <span>❤️ Lives: <b id="lives">3</b></span>
            <span>⏱️ Time: <b id="time">30</b></span>
        </div>

        <div id="gameArea">

            <button id="target"></button>

            <button id="enemy"></button>

            <button id="powerUp">⚡</button>

        </div>

        <button id="startButton">START GAME</button>

        <p id="message">Click START to begin!</p>

    </div>

    <script src="script.js"></script>

</body>

</html>
